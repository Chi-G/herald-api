version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: herald_postgres

    environment:
      POSTGRES_USER: herald
      POSTGRES_PASSWORD: heraldpassword
      POSTGRES_DB: herald
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
